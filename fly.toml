# clsi-rs on fly.io. Single HTTP port (3013), ephemeral work dir.
# Compare to fly/ which was the CE-image-based deploy — kept under fly/ for
# reference until clsi-rs is committed to.
app = 'clsi-amber'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLSI_BIND = '0.0.0.0:3013'
  CLSI_WORK_DIR = '/work'

# Inherited from the prior CE-based deploy. Not strictly needed (clsi-rs is
# fine with an ephemeral work dir) but keeps the volume attached to avoid a
# destructive change. Delete with `fly volumes destroy` once committed.
[[mounts]]
  source = 'clsi_data'
  destination = '/work'

[[services]]
  protocol = 'tcp'
  internal_port = 3013
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 3013
    handlers = ['http']

  [services.concurrency]
    type = 'requests'
    hard_limit = 4
    soft_limit = 2

[[vm]]
  # ~10x cheaper than the performance-2x we needed for the CE monolith.
  size = 'shared-cpu-2x'
  memory = '2gb'
