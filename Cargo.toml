[package]
name = "clsi-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "signal", "time"] }
tower = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-credential-types = "1"
mime_guess = "2"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
